name: Build and Release deploy.zip

on:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
      - 'public/**'
      - 'wrangler.toml'
      - '.github/workflows/release-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deploy.zip
        run: |
          zip -r deploy.zip _worker.js wrangler.toml
          if [ -d "public" ]; then
            zip -r deploy.zip public/
          fi

      - name: Generate Version Tag
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ### 📦 بسته آماده دیپلوی در کلادفلر پیجز (Pages Deploy Package)

            - نسخه: `${{ steps.version.outputs.tag }}`
            - هش کامیت: `${{ github.sha }}`
            - بدون نیاز به کامپیوتر یا سیستم، می‌توانید این فایل را با موبایل دانلود کرده و در پنل کلادفلر مستقیماً آپلود کنید.
            - برای راهنمای گام‌به‌گام استقرار، به [README.md](README.md) مراجعه کنید.
          files: deploy.zip

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Ready-to-Deploy Assets"
          body: |
            ### 📦 بسته آماده دیپلوی در کلادفلر پیجز (Pages Deploy Package)

            - آخرین نسخه ساخته شده: `${{ steps.version.outputs.tag }}`
            - بدون نیاز به کامپیوتر یا سیستم، می‌توانید این فایل را با موبایل دانلود کرده و در پنل کلادفلر مستقیماً آپلود کنید.
            - برای راهنمای گام‌به‌گام استقرار، به [README.md](README.md) مراجعه کنید.
          files: deploy.zip
          make_latest: true

