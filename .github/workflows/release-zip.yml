name: Build and Release deploy.zip

on:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
      - 'public/**'
      - 'wrangler.toml'
      - '.github/workflows/release-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create deploy.zip
        run: |
          zip -r deploy.zip _worker.js wrangler.toml
          if [ -d "public" ]; then
            zip -r deploy.zip public/
          fi

      - name: Determine Next Sequential Version
        id: version
        run: |
          # Fetch all remote tags to ensure full list
          git fetch --tags --force

          # Find highest integer N from tags matching pattern ^v[0-9]+$
          MAX_NUM=0
          for tag in $(git tag -l 'v*'); do
            if [[ "$tag" =~ ^v([0-9]+)$ ]]; then
              NUM="${BASH_REMATCH[1]}"
              if (( NUM > MAX_NUM )); then
                MAX_NUM=$NUM
              fi
            fi
          done

          NEXT_NUM=$((MAX_NUM + 1))
          TAG_NAME="v${NEXT_NUM}"

          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Next release version: ${TAG_NAME}"

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ### 📦 بسته آماده دیپلوی در کلادفلر پیجز (Pages Deploy Package)

            - نسخه: `${{ steps.version.outputs.tag }}`
            - هش کامیت: `${{ github.sha }}`
            - بدون نیاز به کامپیوتر یا سیستم، می‌توانید این فایل را با موبایل دانلود کرده و در پنل کلادفلر مستقیماً آپلود کنید.
            - برای راهنمای گام‌به‌گام استقرار، به [README.md](README.md) مراجعه کنید.
          files: deploy.zip
          make_latest: true
